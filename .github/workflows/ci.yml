name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Download the dataset from UCI
        run: |
          curl -sSfL -o dataset.zip "https://archive.ics.uci.edu/static/public/468/online+shoppers+purchasing+intention+dataset.zip"
          mkdir -p data
          unzip -o -q dataset.zip online_shoppers_intention.csv -d data

      - name: Tests
        run: uv run pytest -q
