[project]
name = "predator"
version = "1.0.0"
description = "Predicts whether an online shopping session ends in a purchase and explains which features drive the prediction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "joblib>=1.6.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["predator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py315"
# Both notebooks are generated by scripts/build_notebooks.py from the package code.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
# The code is written in a beginner-student style on purpose: explicit
# if/else blocks and loops are kept instead of ternaries and all()/any().
# Line length is left to the formatter; long strings and comments are fine.
ignore = ["SIM108", "SIM110", "E501"]
